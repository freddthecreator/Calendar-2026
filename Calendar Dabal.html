<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="https://cdn3d.iconscout.com/3d/premium/thumb/calendar-2026-3d-icon-png-download-13750511.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar 2026</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<style>
.table th { background-color: #fc3636; color: rgba(0, 0, 0, 0.349); text-align: center; font-weight: bold; }
.table td { height: 100px; vertical-align: top; padding: 5px; font-size: 14px; position: relative; }
.today { background-color: #ffc107 !important; font-weight: bold; }
.holiday { background-color: #ff0019 !important; color: white; }
.weekend { background-color: #9a9c9ea2; }
.nav-link.active { background-color: #fc3636 !important; color: white !important; }
</style>
</head>
<body class="bg-light">
<div class="container-fluid py-4">
<div class="row justify-content-center">
<div class="col-md-10">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 rounded">
<div class="container-fluid">
<ul class="navbar-nav mx-auto">
<li class="nav-item"><a class="nav-link active" href="#" data-month="0">Jan</a></li>
<li class="nav-item"><a class="nav-link" href="#" data-month="1">Feb</a></li>
<li class="nav-item"><a class="nav-link" href="#" data-month="2">Mar</a></li>
<li class="nav-item"><a class="nav-link" href="#" data-month="3">Apr</a></li>
<li class="nav-item"><a class="nav-link" href="#" data-month="4">May</a></li>
<li class="nav-item"><a class="nav-link" href="#" data-month="5">Jun</a></li>
<li class="nav-item"><a class="nav-link" href="#" data-month="6">Jul</a></li>
<li class="nav-item"><a class="nav-link" href="#" data-month="7">Aug</a></li>
<li class="nav-item"><a class="nav-link" href="#" data-month="8">Sep</a></li>
<li class="nav-item"><a class="nav-link" href="#" data-month="9">Oct</a></li>
<li class="nav-item"><a class="nav-link" href="#" data-month="10">Nov</a></li>
<li class="nav-item"><a class="nav-link" href="#" data-month="11">Dec</a></li>
</ul>
</div>
</nav>
<div id="calendar-container">
<div class="table-responsive">
<table class="table table-bordered table-sm rounded shadow-sm" id="calendar-table">
<thead><tr><th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th></tr></thead>
<tbody id="calendar-body"></tbody>
</table>
</div>
</div>
</div>
</div>
</div>
<script>
const monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
const daysInMonth=[31,29,31,30,31,30,31,31,30,31,30,31];
const holidays2026={'2026-01-01':'New Year','2026-07-04':'Independence Day','2026-11-26':'Thanksgiving','2026-12-25':'Christmas'};
let currentMonth=0;
function generateCalendar(month){
const date=new Date(2026,month,1);
const year=2026;
const days=daysInMonth[month];
const firstDay=date.getDay();
const monthName=monthNames[month];
let tableHTML='<thead class="table-dark"><tr><th colspan="7" class="text-center fs-4 fw-bold">'+monthName+' 2026</th></tr><tr><th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th></tr></thead><tbody>';
let dayCount=1;
for(let i=0;i<6;i++){
tableHTML+='<tr>';
for(let j=0;j<7;j++){
if(i===0&&j<firstDay){
tableHTML+='<td></td>';
}else if(dayCount<=days){
const dayDate=`${year}-${String(month+1).padStart(2,'0')}-${String(dayCount).padStart(2,'0')}`;
let cellClass='day';
if(j===0||j===6)cellClass+=' weekend';
if(holidays2026[dayDate])cellClass+=' holiday';
const today=new Date();
const todayStr=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
if(dayDate===todayStr)cellClass+=' today';
let dayContent=dayCount;
if(holidays2026[dayDate])dayContent=`<div class="fw-bold">${dayCount}</div><small>${holidays2026[dayDate]}</small>`;
tableHTML+=`<td class="${cellClass}">${dayContent}</td>`;
dayCount++;
}else{
tableHTML+='<td></td>';
}
}
tableHTML+='</tr>';
if(dayCount>days)break;
}
tableHTML+='</tbody>';
document.getElementById('calendar-table').innerHTML=tableHTML;
}
document.querySelectorAll('.nav-link').forEach(link=>{
link.addEventListener('click',function(e){
e.preventDefault();
currentMonth=parseInt(this.dataset.month);
document.querySelectorAll('.nav-link').forEach(l=>l.classList.remove('active'));
this.classList.add('active');
generateCalendar(currentMonth);
});
});
generateCalendar(0);
</script>
</body>
</html>
